name: Deploy Laravel Fullstack to NhanHoa via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, bcmath, pdo_mysql, gd, zip
          coverage: none

      - name: Install Composer dependencies for build
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Deploy files to NhanHoa FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: share-dedi04.nhanhoa.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /home/nhthakpy/pkngocnhan.vn/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/debugbar/**
            **/public/storage/**
            **/.env
            **/.env.*
            **/.phpunit.result.cache
            **/public/hot
            **/README.md
            **/AGENTS.md
            **/CLAUDE.md
