name: Deploy Laravel Fullstack to NhanHoa via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, bcmath, pdo_mysql, gd, zip
          coverage: none

      - name: Install Composer dependencies for build
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: FTP debug (read-only) - DNS check
        run: |
          echo "Checking DNS resolution..."
          getent hosts share-dedi04.nhanhoa.com || true
          getent hosts ftp.phuongvietit.vn || true

      - name: FTP debug (read-only) - list root
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Listing FTP root '/' (read-only)..."
          curl --show-error --silent --disable-epsv --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only "ftp://share-dedi04.nhanhoa.com:21/"

      - name: FTP debug (read-only) - list secret dir
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "FTP_SERVER_DIR from secret: '$FTP_SERVER_DIR'"
          TARGET="${FTP_SERVER_DIR%/}/"
          echo "Listing FTP path: $TARGET (read-only)..."
          curl --show-error --silent --disable-epsv --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only "ftp://share-dedi04.nhanhoa.com:21${TARGET}"
